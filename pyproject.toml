[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pjepa"
version = "0.1.0"
description = "Self-supervised temporal representation learning on video features"
requires-python = ">=3.11"
dependencies = ["torch>=2.6", "numpy>=1.26", "timm>=0.6.13", "loguru>=0.7"]

[project.optional-dependencies]
temporal = ["einops>=0.6"]
builders = ["lmdb>=1.4", "tqdm>=4.66"]
tracking = ["wandb>=0.16"]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pjepa = ["artifacts.json", "_vendor/ltcontext/LICENSE", "models/VJEPA_LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
